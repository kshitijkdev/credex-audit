name: Detect pricing changes

on:
  schedule:
    - cron: "0 9 * * *"   # 9 AM UTC daily
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger detect-changes endpoint
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DETECT_CHANGES_SECRET }}\"}" \
            ${{ secrets.NEXT_PUBLIC_BASE_URL }}/api/detect-changes